general {
    gaps_in = 2
    gaps_out = 5
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 6
        passes = 4
        ignore_opacity = true
        new_optimizations = true
    }
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

